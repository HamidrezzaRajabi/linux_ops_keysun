[defaults]
# Relative paths below are resolved from the directory of this file.
inventory = inventories/lab
# gathering = explicit
roles_path = roles
host_key_checking = True
retry_files_enabled = False
callback_result_format = yaml
interpreter_python = auto_silent
forks = 10
# Do NOT set deprecation_warnings = False: you want to see them.

[privilege_escalation]
# become is requested explicitly in each play; only the method is set here.
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
