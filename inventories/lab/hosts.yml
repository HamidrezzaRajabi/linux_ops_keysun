---
# Lab inventory. NO passwords here: automation uses a key-only account that
# playbooks/bootstrap_automation_user.yml creates (see docs/OPERATIONS.md).
all:
  children:
    linux_servers:
      hosts:
        test_server:
          ansible_host: 192.168.10.50
      vars:
        ansible_user: ansible
        #ansible_password: 
        ansible_ssh_private_key_file: ~/.ssh/ansible_ed25519
